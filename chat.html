<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Bid Day Chat - Ralph's Drivers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: #0d0d0d; border-bottom: 3px solid #ef4444; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: clamp(18px, 4vw, 24px); font-weight: 800; color: #fff; }
    .header a { color: #60a5fa; text-decoration: none; font-size: 16px; font-weight: 600; }
    .online-strip { background: #0d0d0d; border-bottom: 1px solid #333; padding: 8px 16px; font-size: 13px; color: #4ade80; min-height: 34px; }
    .online-strip .label { color: #888; margin-right: 6px; }
    .join-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    .join-screen h2 { font-size: clamp(22px, 5vw, 32px); margin-bottom: 8px; }
    .join-screen p { color: #888; font-size: 15px; margin-bottom: 24px; }
    .join-screen input { width: 100%; max-width: 320px; padding: 14px 16px; background: #0d0d0d; border: 2px solid #333; border-radius: 10px; color: #fff; font-size: 18px; margin-bottom: 16px; text-align: center; }
    .join-screen input:focus { outline: none; border-color: #ef4444; }
    .join-screen button { width: 100%; max-width: 320px; padding: 14px; background: #ef4444; border: none; border-radius: 10px; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
    .join-screen button:disabled { background: #333; color: #666; cursor: not-allowed; }
    .join-screen button:not(:disabled):active { background: #dc2626; }
    .chat-screen { flex: 1; display: none; flex-direction: column; }
    .chat-screen.active { display: flex; }
    .messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg.them { background: #0d0d0d; align-self: flex-start; border: 1px solid #333; }
    .msg.me { background: #1e3a5f; align-self: flex-end; border: 1px solid #3b82f6; }
    .msg .who { font-size: 12px; font-weight: 700; color: #60a5fa; margin-bottom: 4px; }
    .msg.me .who { color: #93c5fd; }
    .msg .time { font-size: 10px; color: #666; margin-top: 4px; text-align: right; }
    .system-msg { text-align: center; color: #888; font-size: 12px; padding: 4px 0; font-style: italic; }
    .input-bar { background: #0d0d0d; border-top: 2px solid #333; padding: 10px 16px; display: flex; gap: 10px; }
    .input-bar input { flex: 1; padding: 12px 14px; background: #1a1a1a; border: 2px solid #333; border-radius: 10px; color: #fff; font-size: 16px; }
    .input-bar input:focus { outline: none; border-color: #ef4444; }
    .input-bar button { padding: 12px 20px; background: #ef4444; border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    .input-bar button:active { background: #dc2626; }
    .version { color: #FFD700; font-size: 11px; text-align: center; padding: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Bid Day Chat</h1>
    <a href="index.html">Home</a>
  </div>
  <div class="online-strip" id="online-strip"><span class="label">Online:</span><span id="online-list">Nobody yet</span></div>

  <div class="join-screen" id="join-screen">
    <h2>Join the Room</h2>
    <p>Enter your display name to start chatting</p>
    <input type="text" id="display-name" placeholder="Your name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="20">
    <button id="join-btn" disabled>Enter Chat Room</button>
  </div>

  <div class="chat-screen" id="chat-screen">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>
  <div class="version">11.27.26 V0.04</div>

  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <script>
    var ABLY_KEY = "9Ff5mg.613iFw:A40rQj2x0JZDN7B8DaH5l-zHD06I5fH18262wv1_vOI";
    var CHANNEL_NAME = "bid-day-chat";
    var myName = "";
    var channel = null;
    var client = null;

    var BAD_WORDS = ["fuck","fucking","fucker","fucked","shit","shitting","shitty","bitch","bitches","bastard","asshole","ass","damn","hell","crap","piss","dick","cock","pussy","whore","slut","retard","nigger","faggot","cunt"];

    var nameInput = document.getElementById("display-name");
    var joinBtn = document.getElementById("join-btn");
    var joinScreen = document.getElementById("join-screen");
    var chatScreen = document.getElementById("chat-screen");
    var messagesDiv = document.getElementById("messages");
    var msgInput = document.getElementById("msg-input");
    var sendBtn = document.getElementById("send-btn");
    var onlineList = document.getElementById("online-list");

    function updateJoinBtn() {
      joinBtn.disabled = nameInput.value.trim().length === 0;
    }
    nameInput.addEventListener("input", updateJoinBtn);
    nameInput.addEventListener("keydown", updateJoinBtn);
    nameInput.addEventListener("paste", function() { setTimeout(updateJoinBtn, 0); });

    nameInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !joinBtn.disabled) joinRoom();
    });

    joinBtn.addEventListener("click", joinRoom);

    function joinRoom() {
      myName = nameInput.value.trim().slice(0, 20);
      if (!myName) return;
      joinScreen.style.display = "none";
      chatScreen.classList.add("active");
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
      connectAbly();
    }

    function connectAbly() {
      client = new Ably.Realtime({ key: ABLY_KEY, clientId: myName });
      channel = client.channels.get(CHANNEL_NAME);

      channel.presence.get(function(err, members) {
        if (!err) updateOnlineList(members);
      });

      channel.presence.subscribe("enter", function(member) {
        addSystemMsg(member.clientId + " joined");
        channel.presence.get(function(err, members) {
          if (!err) updateOnlineList(members);
        });
      });

      channel.presence.subscribe("leave", function(member) {
        addSystemMsg(member.clientId + " left");
        channel.presence.get(function(err, members) {
          if (!err) updateOnlineList(members);
        });
      });

      channel.presence.enter(function(err) {
        if (err) addSystemMsg("Could not join presence: " + err.message);
      });

      channel subscribe(function(message) {
        if (message.name === "chat") {
          showMessage(message.data.name, message.data.text, message.data.name === myName);
        }
      });
    }

    function updateOnlineList(members) {
      if (!members || members.length === 0) {
        onlineList.textContent = "Nobody yet";
        return;
      }
      var names = [];
      for (var i = 0; i < members.length; i++) {
        names.push(members[i].clientId);
      }
      onlineList.textContent = names.join(", ");
    }

    function containsBadWord(text) {
      var lower = text.toLowerCase();
      for (var i = 0; i < BAD_WORDS.length; i++) {
        if (lower.indexOf(BAD_WORDS[i]) !== -1) return true;
      }
      return false;
    }

    function sendMessage() {
      var text = msgInput.value.trim();
      if (!text) return;
      if (containsBadWord(text)) {
        alert("Please keep it clean in this room. No profanity allowed.");
        return;
      }
      channel publish("chat", { name: myName, text: text });
      msgInput.value = "";
      msgInput.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendMessage();
    });

    function showMessage(name, text, isMe) {
      var div = document.createElement("div");
      div.className = "msg " + (isMe ? "me" : "them");
      var who = document.createElement("div");
      who.className = "who";
      who.textContent = name;
      var body = document.createElement("div");
      body.textContent = text;
      var time = document.createElement("div");
      time.className = "time";
      var now = new Date();
      time.textContent = (now.getHours() % 12 || 12) + ":" + (now.getMinutes() < 10 ? "0" : "") + now.getMinutes() + " " + (now.getHours() >= 12 ? "PM" : "AM");
      div.appendChild(who);
      div.appendChild(body);
      div.appendChild(time);
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMsg(text) {
      var div = document.createElement("div");
      div.className = "system-msg";
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    var APP_VERSION = "11.27.26 V0.04";
    var stored = localStorage.getItem("bidday_version");
    if (stored !== APP_VERSION) {
      localStorage.setItem("bidday_version", APP_VERSION);
      if (stored !== null) {
        var bust = "?v=" + Date.now();
        if (location.search.indexOf("v=") === -1) {
          location.replace(location.protocol + "//" + location.host + location.hostname + location.dirname + location.basename + bust);
        }
      }
    }
  </script>
</body>
</html>
