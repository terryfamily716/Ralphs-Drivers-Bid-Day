<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Ralph's Drivers Bid Day Live - Schedule</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { flex-shrink: 0; display: flex; justify-content: flex-start; padding: 12px 16px; }
    .back-link { display: inline-block; padding: 10px 16px; background: #0d0d0d; border: 2px solid #60a5fa; border-radius: 8px; color: #60a5fa; text-decoration: none; font-size: 16px; font-weight: 600; }
    .back-link:active { background: #1a1a1a; }
    header { flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 16px; }
    header h1 { font-size: clamp(28px, 8vw, 64px); font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
    header p { font-size: clamp(16px, 4vw, 28px); color: #4ade80; font-weight: 600; }
    .version { color: #FFD700; font-size: clamp(12px, 3vw, 16px); font-weight: 600; margin-top: 4px; }
    .slider { flex: 1; position: relative; overflow: hidden; touch-action: pan-y; }
    .track { display: flex; height: 100%; transition: transform 0.35s ease; }
    .page { flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; padding: 0 16px 16px; }
    .schedule-card { background: #0d0d0d; border: 3px solid #ef4444; border-radius: 8px; padding: 16px; }
    .schedule-card h2 { font-size: clamp(20px, 5vw, 32px); font-weight: 800; color: #ef4444; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .schedule-card p { font-size: clamp(16px, 4vw, 24px); line-height: 1.5; color: #fff; font-weight: 600; margin-bottom: 12px; }
    .coming-soon { font-size: clamp(22px, 6vw, 40px); font-weight: 800; color: #FFD700; text-align: center; padding: 40px 0; letter-spacing: 2px; }
    .dots { flex-shrink: 0; display: flex; justify-content: center; gap: 12px; padding: 12px 0 20px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #444; transition: background 0.3s; }
    .dot.active { background: #ef4444; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="back-link" href="index.html">&larr; Back to Home</a>
  </div>
  <header>
    <h1>Riverside Driver Schedule</h1>
    <p>Week of 11/26/26</p>
    <div class="version">11.27.26 V0.01</div>
  </header>
  <div class="slider" id="slider">
    <div class="track" id="track">
      <div class="page">
        <div class="schedule-card">
          <h2>This Week</h2>
          <p>Swipe right to see next week's schedule.</p>
          <div class="coming-soon">COMING SOON</div>
        </div>
      </div>
      <div class="page">
        <div class="schedule-card">
          <h2>Next Week</h2>
          <p>Week of December 3, 2026</p>
          <div class="coming-soon">COMING SOON</div>
        </div>
      </div>
    </div>
  </div>
  <div class="dots" id="dots">
    <div class="dot active" data-page="0"></div>
    <div class="dot" data-page="1"></div>
  </div>
  <script>
    var APP_VERSION = "11.27.26 V0.01";
    var stored = localStorage.getItem("bidday_schedule_version");
    if (stored !== APP_VERSION) {
      localStorage.setItem("bidday_schedule_version", APP_VERSION);
      if (stored !== null) {
        var bust = "?v=" + Date.now();
        if (location.search.indexOf("v=") === -1) {
          location.replace(location.protocol + "//" + location.host + location.pathname + bust);
        }
      }
    }
    (function () {
      var track = document.getElementById("track");
      var dots = document.querySelectorAll(".dot");
      var slider = document.getElementById("slider");
      var current = 0;
      var total = 2;
      var startX = 0;
      var startY = 0;
      var isDown = false;
      var threshold = 60;

      function goTo(page) {
        current = Math.max(0, Math.min(total - 1, page));
        track.style.transform = "translateX(-" + (current * 100) + "%)";
        for (var i = 0; i < dots.length; i++) {
          dots[i].classList.toggle("active", i === current);
        }
      }

      slider.addEventListener("touchstart", function (e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isDown = true;
      }, { passive: true });

      slider.addEventListener("touchmove", function (e) {
        if (!isDown) return;
        var dx = e.touches[0].clientX - startX;
        var dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy)) {
          track.style.transition = "none";
          track.style.transform = "translateX(calc(-" + (current * 100) + "% + " + dx + "px))";
        }
      }, { passive: true });

      slider.addEventListener("touchend", function (e) {
        if (!isDown) return;
        isDown = false;
        track.style.transition = "";
        var dx = e.changedTouches[0].clientX - startX;
        if (dx < -threshold) goTo(current + 1);
        else if (dx > threshold) goTo(current - 1);
        else goTo(current);
      }, { passive: true });

      slider.addEventListener("mousedown", function (e) {
        startX = e.clientX;
        startY = e.clientY;
        isDown = true;
        track.style.transition = "none";
      });

      window.addEventListener("mousemove", function (e) {
        if (!isDown) return;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (Math.abs(dx) > Math.abs(dy)) {
          track.style.transform = "translateX(calc(-" + (current * 100) + "% + " + dx + "px))";
        }
      });

      window.addEventListener("mouseup", function (e) {
        if (!isDown) return;
        isDown = false;
        track.style.transition = "";
        var dx = e.clientX - startX;
        if (dx < -threshold) goTo(current + 1);
        else if (dx > threshold) goTo(current - 1);
        else goTo(current);
      });

      for (var d = 0; d < dots.length; d++) {
        dots[d].addEventListener("click", function () {
          goTo(parseInt(this.getAttribute("data-page"), 10));
        });
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") goTo(current + 1);
        else if (e.key === "ArrowLeft") goTo(current - 1);
      });
    })();
  </script>
</body>
</html>
