<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Ralph's Drivers Bid Day Live - Driver Schedule (Photo)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; }
    .top-bar { display: flex; justify-content: flex-start; padding: 12px 16px; background: #0d0d0d; }
    .back-link { display: inline-block; padding: 14px 24px; background: #0d0d0d; border: 3px solid #60a5fa; border-radius: 10px; color: #60a5fa; text-decoration: none; font-size: 18px; font-weight: 700; }
    header { text-align: center; padding: 16px; }
    header h1 { font-size: clamp(24px, 6vw, 48px); font-weight: 800; margin-bottom: 8px; }
    .week-banner { font-size: clamp(28px, 7vw, 56px); font-weight: 900; color: #facc15; background: #2a1a1a; padding: 12px 24px; border-radius: 12px; margin: 8px auto; display: inline-block; }
    .version { color: #FFD700; font-size: 14px; font-weight: 600; margin-top: 6px; }
    .note { text-align: center; padding: 10px 16px; color: #facc15; font-size: 15px; }
    .photo-container { overflow: auto; margin: 8px; text-align: center; -webkit-overflow-scrolling: touch; }
    .schedule-photo { width: 100%; max-width: 1200px; height: auto; display: block; margin: 0 auto; border: 3px solid #ef4444; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="back-link" href="index.html">&larr; Back to Home</a>
  </div>
  <header>
    <h1>Riverside Driver Schedule</h1>
    <div class="week-banner">WEEK OF 11/09/26</div>
    <div class="version">11.24.26 V0.07 (Photo)</div>
  </header>
  <div class="note">Scroll and pinch-to-zoom on the photo. Spreadsheet data is saved for when we get a clearer picture to rebuild the table.</div>
  <div class="photo-container">
    <img class="schedule-photo" src="schedule.jpg" alt="Riverside Weekly Master Driver Schedule Week of 11/09/26">
  </div>
  <script>
    var APP_VERSION = "11.24.26 V0.07";
    var stored = localStorage.getItem("bidday_schedule_version");
    if (stored !== APP_VERSION) {
      localStorage.setItem("bidday_schedule_version", APP_VERSION);
      if (stored !== null) {
        var bust = "?v=" + Date.now();
        if (location.search.indexOf("v=") === -1) {
          location.replace(location.protocol + "//" + location.host + location.pathname + bust);
        }
      }
    }
  </script>
</body>
</html>
