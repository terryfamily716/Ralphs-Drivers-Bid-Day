<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ralph's Drivers Bid Day</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    header { background: #0d0d0d; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
    header h1 { font-size: 18px; font-weight: 600; }
    header .live { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4ade80; }
    header .live .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .frame-wrap { flex: 1; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .fallback { display: none; position: absolute; inset: 0; background: #1a1a1a; color: #ccc; padding: 40px 20px; text-align: center; }
    .fallback a { color: #60a5fa; }
    .fallback.show { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Ralph's Drivers Bid Day</h1>
    <div class="live"><span class="dot"></span> Live</div>
  </header>
  <div class="frame-wrap">
    <iframe src="https://docs.google.com/spreadsheets/d/1G-KsmTAOKlJsayk1SGMFyyPiTGP8yEPB4FIyP8YU92U/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false" allowfullscreen></iframe>
    <div class="fallback" id="fallback">
      <p>Sheet didn't load in the frame.</p>
      <p style="margin-top:12px">Make sure the sheet is published to the web:</p>
      <p style="margin-top:8px">File &rarr; Share &rarr; Publish to web &rarr; Embed</p>
      <p style="margin-top:16px"><a href="https://docs.google.com/spreadsheets/d/1G-KsmTAOKlJsayk1SGMFyyPiTGP8yEPB4FIyP8YU92U/edit?usp=drivesdk" target="_blank">Open sheet directly</a></p>
    </div>
  </div>
  <script>
    // If iframe fails to load, show fallback after a few seconds
    setTimeout(function () {
      var frame = document.querySelector('iframe);
      try {
        if (!frame.contentWindow || !frame.contentWindow.location) {
          document.getElementById('fallback').classList.add('show);
        }
      } catch (e) {
        // cross-origin access blocked is normal; leave it alone
      }
    }, 8000);
  </script>
</body>
</html>
