<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailer Seal Notice - Ralph's Drivers Bid Day Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .notice { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; margin: 16px; border-radius: 12px; border: 4px solid #ef4444; background: #0d0d0d; }
    .notice h1 { font-size: clamp(28px, 8vw, 56px); font-weight: 800; line-height: 1.2; margin-bottom: 24px; color: #ef4444; }
    .notice p { font-size: clamp(18px, 5vw, 32px); font-weight: 600; line-height: 1.4; margin-bottom: 16px; }
    .notice .highlight { color: #fbbf24; }
    .back-link { display: block; text-align: center; padding: 22px 20px; background: #0d0d0d; border: 4px solid #ef4444; border-radius: 12px; margin: 8px 16px; color: #60a5fa; text-decoration: none; font-size: 22px; font-weight: 700; }
    .back-link:active { background: #1a1a1a; }
  </style>
</head>
<body>
  <div class="notice">
    <h1>ATTENTION DRIVERS</h1>
    <p>Make sure you are watching receivers seal your trailer from now on, so they don't accidentally have the door open up on you in transit.</p>
    <p class="highlight">Management is looking to write drivers up for this.</p>
  </div>
  <a class="back-link" href="index.html">&larr; Back to Bid Day Live</a>
</body>
</html>
