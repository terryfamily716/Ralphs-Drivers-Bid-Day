<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ralph's Drivers Bid Day Live Tabs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0d0d0d; padding: 16px 20px; border-bottom: 1px solid #333; text-align: center; }
    header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 14px; color: #4ade80; }
    .frame-wrap { flex: 1; position: relative; min-height: 70vh; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .back-link { display: block; text-align: center; padding: 14px 20px; background: #0d0d0d; border-top: 1px solid #333; color: #60a5fa; text-decoration: none; font-size: 15px; font-weight: 600; }
    .back-link:active { background: #1a1a1a; }
    .fallback { display: none; position: absolute; inset: 0; background: #1a1a1a; color: #ccc; padding: 40px 20px; text-align: center; }
    .fallback a { color: #60a5fa; }
    .fallback.show { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Ralph's Drivers Bid Day Live</h1>
    <p>Where the bid happens in real time</p>
  </header>
  <div class="frame-wrap">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSE3FJPXKL-VgyfRm0PRE48jqeSfxc00FToYZVbNJdKT0Q6JYk06e9vTzVZsWkLNzfd9DHbEvYfhfes/pubhtml?widget=true&headers=false" allowfullscreen></iframe>
    <div class="fallback" id="fallback">
      <p>Sheet didn't load in the frame.</p>
      <p style="margin-top:12px">Make sure the sheet is published to the web:</p>
      <p style="margin-top:8px">File &rarr; Share &rarr; Publish to web &rarr; Embed</p>
      <p style="margin-top:16px"><a href="https://docs.google.com/spreadsheets/d/1G-KsmTAOKlJsayk1SGMFyyPiTGP8yEPB4FIyP8YU92U/edit?usp=drivesdk" target="_blank">Open sheet directly</a></p>
    </div>
  </div>
  <a class="back-link" href="index.html">&larr; Back to Bid Day Live</a>
  <script>
    setTimeout(function () {
      var frame = document.querySelector('iframe);
      try {
        if (!frame.contentWindow || !frame.contentWindow.location) {
          document.getElementById('fallback').classList.add('show);
        }
      } catch (e) {
        // cross-origin access blocked is normal; leave it alone
      }
    }, 8000);
  </script>
</body>
</html>
