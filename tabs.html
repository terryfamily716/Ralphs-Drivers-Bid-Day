<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ralph's Drivers Bid Day Live Tabs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; display: flex; flex-direction: column; }
    header { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; border: 12px solid #ef4444; margin: 16px; border-radius: 12px; }
    header h1 { font-size: clamp(28px, 8vw, 64px); font-weight: 800; line-height: 1.1; margin-bottom: 16px; }
    header p { font-size: clamp(16px, 4vw, 28px); color: #4ade80; font-weight: 600; }
    .frame-wrap { flex: 2; position: relative; min-height: 0; margin: 0 16px 16px; border: 12px solid #ef4444; border-radius: 12px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .back-link { display: block; text-align: center; padding: 10px 16px; background: #0d0d0d; border-top: 1px solid #333; color: #60a5fa; text-decoration: none; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .back-link:active { background: #1a1a1a; }
    .fallback { display: none; position: absolute; inset: 0; background: #1a1a1a; color: #ccc; padding: 40px 20px; text-align: center; }
    .fallback a { color: #60a5fa; }
    .fallback.show { display: block; }
    @media (orientation: landscape) {
      header { padding: 12px; }
      header h1 { font-size: clamp(24px, 6vw, 48px); }
      header p { font-size: clamp(14px, 3vw, 22px); }
      .frame-wrap { margin: 0 16px 8px; }
      .back-link { padding: 6px 16px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ralph's Drivers Bid Day Live</h1>
    <p>Where the bid happens in real time</p>
  </header>
  <div class="frame-wrap">
    <iframe src="https://docs.google.com/spreadsheets/d/1G-KsmTAOKlJsayk1SGMFyyPiTGP8yEPB4FIyP8YU92U/pubhtml" allowfullscreen></iframe>
    <div class="fallback" id="fallback">
      <p>Sheet didn't load in the frame.</p>
      <p style="margin-top:12px">Make sure the sheet is published to the web:</p>
      <p style="margin-top:8px">File &rarr; Share &rarr; Publish to web &rarr; Embed</p>
      <p style="margin-top:16px"><a href="https://docs.google.com/spreadsheets/d/1G-KsmTAOKlJsayk1SGMFyyPiTGP8yEPB4FIyP8YU92U/edit?usp=drivesdk" target="_blank">Open sheet directly</a></p>
    </div>
  </div>
  <a class="back-link" href="index.html">&larr; Back to Bid Day Live</a>
  <script>
    setTimeout(function () {
      var frame = document.querySelector('iframe);
      try {
        if (!frame.contentWindow || !frame.contentWindow.location) {
          document.getElementById('fallback').classList.add('show);
        }
      } catch (e) {
        // cross-origin access blocked is normal; leave it alone
      }
    }, 8000);
  </script>
</body>
</html>
